<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Warm Register ตั้งค่าโปรไฟล์</title>
</head>
<body style="margin:0;background:#E9E2DA;display:flex;justify-content:center;padding:24px 0">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#5A2E14}a:hover{color:#1F1A17}
</style>
<div style="width: 390px; height: 1120px; box-sizing: border-box; background: #F5F0EB; color: #1F1A17; font-family: 'Anuphan', sans-serif; display: flex; flex-direction: column">
<div style="height: 64px; padding: 0 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0">
<a href="02-login.html" aria-label="ย้อนกลับ" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F1A17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<div style="font-size: 18px; font-weight: 600">ตั้งค่าโปรไฟล์</div>
</div>
<div style="padding: 8px 22px 0; display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 26px; font-weight: 700; display: flex; align-items: center; gap: 8px">ยินดีต้อนรับสู่ LaMoon<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" style="transform: rotate(-12deg)"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" fill="#E8793A"/></svg><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="margin-left: -6px; margin-top: -14px"><path d="M12 2l2 7 7 2-7 2-2 7-2-7-7-2 7-2z" fill="#5A2E14"/></svg></h1>
<p style="margin: 0; font-size: 14px; line-height: 1.6; color: #4A3A30">บอกเราเล็กน้อย เพื่อให้การ์ดที่ปัดตรงใจตั้งแต่ใบแรก</p>
</div>
<div style="margin: 18px 16px 0; background: #FFFFFF; border-radius: 28px; padding: 18px; display: flex; align-items: center; gap: 14px">
<div style="width: 64px; height: 64px; border-radius: 50%; background: #F9D9C2; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #5A2E14; text-align: center; line-height: 1.2; flex-shrink: 0">[รูปจาก<br>Google]</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
<label for="dn" style="font-size: 13px; font-weight: 600">ชื่อที่แสดง</label>
<input id="dn" type="text" value="[ชื่อจาก Google]" style="height: 46px; box-sizing: border-box; border: 0; border-radius: 999px; background: #F5F0EB; padding: 0 16px; font-family: 'Anuphan', sans-serif; font-size: 15px; color: #1F1A17; outline: none; width: 100%">
<div style="font-size: 12px; color: #6E625A">เปลี่ยนได้ทีหลัง</div>
</div>
</div>
<div style="margin: 14px 16px 0; background: #FFFFFF; border-radius: 28px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><div style="font-size: 16px; font-weight: 600">มู้ดที่ชอบ</div><div style="font-size: 12px; color: #6E625A">เลือกแล้ว 2</div></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button style="all: unset; cursor: pointer; height: 40px; padding: 0 14px; border-radius: 999px; background: #5A2E14; color: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>ชิลริมน้ำ</button>
<button style="all: unset; cursor: pointer; height: 40px; padding: 0 14px; border-radius: 999px; background: #5A2E14; color: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>ภูเขา หมอก</button>
<button style="all: unset; cursor: pointer; height: 40px; padding: 0 16px; border-radius: 999px; background: #F5F0EB; font-size: 14px; display: flex; align-items: center">สายกิน</button>
<button style="all: unset; cursor: pointer; height: 40px; padding: 0 16px; border-radius: 999px; background: #F5F0EB; font-size: 14px; display: flex; align-items: center">วัด เมืองเก่า</button>
<button style="all: unset; cursor: pointer; height: 40px; padding: 0 16px; border-radius: 999px; background: #F5F0EB; font-size: 14px; display: flex; align-items: center">อยากเงียบๆ</button>
<button style="all: unset; cursor: pointer; height: 40px; padding: 0 16px; border-radius: 999px; background: #F5F0EB; font-size: 14px; display: flex; align-items: center">ถ่ายรูปสวย</button>
<button style="all: unset; cursor: pointer; height: 40px; padding: 0 16px; border-radius: 999px; background: #F5F0EB; font-size: 14px; display: flex; align-items: center">ผจญภัย</button>
</div>
</div>
<div style="margin: 14px 16px 0; background: #FFFFFF; border-radius: 28px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><div style="font-size: 16px; font-weight: 600">ภาค/จังหวัดที่อยากไป</div><div style="font-size: 12px; color: #6E625A">ไม่บังคับ</div></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button style="all: unset; cursor: pointer; box-sizing: border-box; height: 72px; border-radius: 20px; background: #F9D9C2; border: 2px solid #E8793A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 14px; font-weight: 600"><span style="width: 14px; height: 14px; border-radius: 50%; background: #B9CBA6"></span>เหนือ</button>
<button style="all: unset; cursor: pointer; box-sizing: border-box; height: 72px; border-radius: 20px; background: #F5F0EB; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 14px"><span style="width: 14px; height: 14px; border-radius: 50%; background: #EDCB8A"></span>อีสาน</button>
<button style="all: unset; cursor: pointer; box-sizing: border-box; height: 72px; border-radius: 20px; background: #F5F0EB; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 14px"><span style="width: 14px; height: 14px; border-radius: 50%; background: #F0BFA6"></span>กลาง</button>
<button style="all: unset; cursor: pointer; box-sizing: border-box; height: 72px; border-radius: 20px; background: #F5F0EB; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 14px"><span style="width: 14px; height: 14px; border-radius: 50%; background: #E6A57E"></span>ตะวันออก</button>
<button style="all: unset; cursor: pointer; box-sizing: border-box; height: 72px; border-radius: 20px; background: #F5F0EB; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 14px"><span style="width: 14px; height: 14px; border-radius: 50%; background: #D8C2B0"></span>ตะวันตก</button>
<button style="all: unset; cursor: pointer; box-sizing: border-box; height: 72px; border-radius: 20px; background: #F9D9C2; border: 2px solid #E8793A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 14px; font-weight: 600"><span style="width: 14px; height: 14px; border-radius: 50%; background: #C6D3C9"></span>ใต้</button>
</div>
<label style="height: 46px; box-sizing: border-box; border-radius: 999px; background: #F5F0EB; padding: 0 16px; display: flex; align-items: center; gap: 10px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E625A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
<input type="text" placeholder="เพิ่มจังหวัด เช่น เชียงใหม่" aria-label="เพิ่มจังหวัดที่อยากไป" style="border: 0; outline: none; background: transparent; font-family: 'Anuphan', sans-serif; font-size: 15px; color: #1F1A17; flex-grow: 1; min-width: 0">
</label>
<div style="display: flex; gap: 8px; flex-wrap: wrap"><span style="height: 34px; padding: 0 8px 0 14px; border-radius: 999px; background: #FBE3D2; font-size: 14px; display: flex; align-items: center; gap: 6px">เชียงใหม่<button aria-label="ลบเชียงใหม่" style="all: unset; cursor: pointer; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1F1A17" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button></span><span style="height: 34px; padding: 0 8px 0 14px; border-radius: 999px; background: #FBE3D2; font-size: 14px; display: flex; align-items: center; gap: 6px">กระบี่<button aria-label="ลบกระบี่" style="all: unset; cursor: pointer; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1F1A17" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button></span></div>
</div>
<label style="margin: 18px 22px 0; display: flex; align-items: flex-start; gap: 12px; cursor: pointer">
<input type="checkbox" checked style="width: 22px; height: 22px; margin: 1px 0 0; accent-color: #5A2E14; flex-shrink: 0">
<span style="font-size: 14px; line-height: 1.6; color: #4A3A30">ฉันยอมรับ <a href="#">ข้อตกลงการใช้งาน</a> และ <a href="#">นโยบายความเป็นส่วนตัว</a></span>
</label>
<div style="flex-grow: 1"></div>
<div style="padding: 20px 16px 28px; display: flex; flex-direction: column; gap: 10px">
<a href="04-map.html" style="height: 56px; border-radius: 999px; background: #5A2E14; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center">เริ่มใช้งาน</a>
<div style="text-align: center; font-size: 12px; color: #6E625A">ต้องยอมรับข้อตกลงก่อน ปุ่มจึงจะกดได้</div>
</div>
</div>
</body>
</html>
